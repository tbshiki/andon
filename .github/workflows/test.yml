name: test

on:
  # 作業ブランチは PR を作らずにローカルで main へマージすることがあるので、main に入る前に作業ブランチでも動かす
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # 境界の判定を誤って GUI が起動しても、既定の 6 時間待ち続けないようにする
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      # action は tag ではなくコミットの SHA で固定する（tag は付け替えられるため）。更新は Dependabot が行う
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # step の shell には matrix を書けないので、pwsh から matrix の PowerShell でテストを起動する
      - name: Test (${{ matrix.shell }})
        shell: pwsh
        run: |
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-Andon.ps1
          exit $LASTEXITCODE
