name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # 境界の判定を誤って GUI が起動しても、既定の 6 時間待ち続けないようにする
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # step の shell には matrix を書けないので、pwsh から matrix の PowerShell でテストを起動する
      - name: Test (${{ matrix.shell }})
        shell: pwsh
        run: |
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-Andon.ps1
          exit $LASTEXITCODE
